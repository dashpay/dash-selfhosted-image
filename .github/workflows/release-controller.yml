name: Release controller tests
on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'deploy/**'
      - '.github/workflows/release-controller.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'deploy/**'
      - '.github/workflows/release-controller.yml'
permissions:
  contents: read
jobs:
  controller:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: python3 -m py_compile scripts/*.py tests/*.py
      - run: python3 -m unittest discover -s tests -v

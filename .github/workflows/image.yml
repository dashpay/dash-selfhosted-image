name: Build, verify and publish runner image

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runner-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    # Building/publishing needs Docker. The persistent runner being built does not.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check locked inputs and source syntax
        run: |
          python3 scripts/check-lock.py
          python3 -m py_compile scripts/*.py
          bash -n scripts/entrypoint.sh scripts/android-emulator.sh scripts/smoke-test.sh

      - name: Make room on the disposable GitHub-hosted builder
        run: |
          # The image contains its own SDK/toolchains; these host copies are unused.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup
          df -h /

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build a local candidate
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: dash-selfhosted-image:test
          provenance: false

      - name: Test without root, capabilities or a host Docker socket
        run: scripts/smoke-test.sh dash-selfhosted-image:test

      - name: Test KVM and boot the pinned Android emulator
        run: scripts/smoke-test.sh dash-selfhosted-image:test --kvm

      - name: Docker Hub metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: dashpay/dash-selfhosted-image
          flavor: latest=false
          tags: |
            type=sha,format=long
            type=semver,pattern={{version}}

      # Follow dashpay/platform's Docker Hub credentials and Docker actions.
      # PR code never receives registry credentials and never publishes an image.
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish the tested build
        id: publish
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - name: Record deployable digest
        if: steps.publish.outcome == 'success'
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          printf 'dashpay/dash-selfhosted-image@%s\n' "$IMAGE_DIGEST" > image-reference.txt
          {
            echo '## Verified runner image'
            echo 'Deploy by digest, not a floating tag:'
            echo '```'
            cat image-reference.txt
            echo '```'
            echo 'Non-root compiler smoke tests, default confinement, KVM VM creation and Android boot passed.'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: steps.publish.outcome == 'success'
        with:
          name: runner-image-reference
          path: |
            image-reference.txt
            image.lock.json
